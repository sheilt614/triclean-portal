# Render Blueprint — New + -> Blueprint, pick this repo. Secrets marked
# "sync: false" are entered in the Render dashboard, not stored here.
services:
  - type: web
    name: triclean-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --timeout 60
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Optional: "email:Name, email:Name" — creates staff logins on startup and
      # prints their set-password links to the Logs tab. See app.py.
      - key: INITIAL_ADMINS
        sync: false
      - key: COMPANY_PHONE
        value: "(917) 582-9876"
      - key: COMPANY_EMAIL
        sync: false
      - key: COMPANY_ADDRESS
        value: "5644 Netherland Ave, Bronx, NY 10471"
      # Outgoing email (optional) — see mailer.py. Without these, nothing is
      # emailed and staff send invite links by hand.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: NOTIFY_EMAILS
        sync: false
